name: Eval live

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: eval-live
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval-live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ROUTE_AGENT_MOLECULAR_SKIP_3D: "true"
      ROUTE_AGENT_EVAL_OUTPUT: ${{ github.workspace }}/eval-out
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --group dev

      - name: Require a model key
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ] && [ -z "${OPENAI_API_KEY}" ]; then
            echo "Set ANTHROPIC_API_KEY or OPENAI_API_KEY as a repository secret."
            exit 1
          fi

      - name: Official dev-set eval (live)
        run: |
          mkdir -p "$ROUTE_AGENT_EVAL_OUTPUT/traces"
          ROUTE_AGENT_MOLECULAR_SKIP_3D=true uv run route-agent debug eval \
            data/design_requests.jsonl \
            --expected data/expected_dev.jsonl \
            --output "$ROUTE_AGENT_EVAL_OUTPUT/actual.jsonl" \
            --report "$ROUTE_AGENT_EVAL_OUTPUT/EVAL_REPORT.md" \
            --trace-dir "$ROUTE_AGENT_EVAL_OUTPUT/traces" \
            --strict

      - name: Score gate
        run: |
          uv run python data/score.py \
            data/expected_dev.jsonl \
            "$ROUTE_AGENT_EVAL_OUTPUT/actual.jsonl" \
            --json > "$ROUTE_AGENT_EVAL_OUTPUT/score.json"
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path(os.environ["ROUTE_AGENT_EVAL_OUTPUT"]) / "score.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          score = float(payload.get("score") or 0)
          print(f"score={score}")
          if score < 0.75:
              print("live eval score is below 0.75")
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-live
          path: |
            ${{ env.ROUTE_AGENT_EVAL_OUTPUT }}/actual.jsonl
            ${{ env.ROUTE_AGENT_EVAL_OUTPUT }}/EVAL_REPORT.md
            ${{ env.ROUTE_AGENT_EVAL_OUTPUT }}/score.json
            ${{ env.ROUTE_AGENT_EVAL_OUTPUT }}/traces/
          retention-days: 14
          if-no-files-found: warn
