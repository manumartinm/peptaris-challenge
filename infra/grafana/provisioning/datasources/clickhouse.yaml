apiVersion: 1

datasources:
  - name: ClickHouse
    uid: route-agent-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      defaultDatabase: route_agent_observability
      username: clickhouse
      secure: false
    secureJsonData:
      password: clickhouse
